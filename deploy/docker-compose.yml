services:
  cuda-study-tutor:
    image: node:22-alpine
    container_name: cuda-study-tutor
    command: ["node", "/app/chat-api.mjs"]
    env_file:
      - /opt/TestScriptStore/.env
    environment:
      PORT: 3038
      MODEL_NAME: deepseek-v4-pro
    volumes:
      - ../server/chat-api.mjs:/app/chat-api.mjs:ro
    restart: unless-stopped

  cuda-study-web:
    image: nginx:1.27-alpine
    container_name: cuda-study-web
    ports:
      - "80:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - cuda-study-tutor
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
